[metadata]
description-file = README.md
license_files = LICENSE

[options]
package_dir =
    =src
packages = find:
python_requires = >=3.8
include_package_data = True
zip_safe = False

[options.packages.find]
where = src
exclude = 
    tests*
    docs*
    examples*

[options.extras_require]
# These are defined in pyproject.toml but included here for compatibility
test = 
    pytest>=7.0.0
    pytest-cov>=4.0.0
    pytest-mock>=3.10.0
    pytest-asyncio>=0.20.0
    pytest-xdist>=3.0.0
    pytest-randomly>=3.10.0
    coverage>=6.0.0

dev = 
    black>=23.0.0
    isort>=5.12.0
    flake8>=6.0.0
    mypy>=1.0.0
    pylint>=2.12.0
    mkdocs>=1.4.0
    mkdocs-material>=9.0.0
    mkdocstrings[python]>=0.20.0

[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = .git,__pycache__,.tox,.pytest_cache,build,dist
per-file-ignores =
    # Allow for non-abstract empty methods in abstract base classes
    __init__.py: WPS604
    # Allow for too many arguments in test files
    tests/*.py: PLR0913

[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True

[coverage:run]
source = src
omit = 
    **/__init__.py
    **/tests/*

[coverage:report]
show_missing = True
skip_covered = True
fail_under = 90

[coverage:html]
directory = coverage_html
title = Windows Operations MCP Test Coverage
