  EDITED  D:\Dev\repos\windows-operations-mcp\pyproject.toml [build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[project]
name = "windows-operations-mcp"
version = "14.2.0"
description = "Windows Operations MCP - Comprehensive Windows system operations for Claude Desktop with MCPB packaging"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Sandra Schipal", email = "sandra@schipal.at" }
]
dependencies = [
    "fastmcp>=3.2.0,<4",
    "psutil>=5.9.0",
    "structlog>=23.0.0",
    "fastapi>=0.95.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pywin32>=305; sys_platform == 'win32'",
    "ruff>=0.15.2",
    "prefab-ui>=0.14.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
apps = [
    "prefab-ui>=0.18.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/sandraschi/windows-operations-mcp"
Documentation = "https://github.com/sandraschi/windows-operations-mcp#readme"
Issues = "https://github.com/sandraschi/windows-operations-mcp/issues"
Source = "https://github.com/sandraschi/windows-operations-mcp"

[project.scripts]
windows-operations-mcp = "windows_operations_mcp.__main__:main"

[tool.mcpb]
manifest = "mcpb/manifest.json"
build-dir = "dist"
signing-key = ""

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md", "*.json", "*.yaml", "*.yml"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
# B904/S110/E722: broad exception patterns in system tooling; E501: long CLI/help strings;
# S6xx: trusted local subprocess/git; S102: dynamic edit shim; S202: controlled tar paths; S112: parse skip
ignore = [
    "S101",
    "B008",
    "E501",
    "B904",
    "S110",
    "E722",
    "S603",
    "S607",
    "S602",
    "S102",
    "S202",
    "S112",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "14.1.0"

[tool.hatch.build.targets.wheel]
packages = ["src/windows_operations_mcp"]
